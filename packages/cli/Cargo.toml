[package]
edition = "2024"
name = "vitul-cli-node"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
napi = "3.12.2"
napi-derive = "3.6.3"
vitul-desktop-cli = { path = "../../crates/tauri-cli", default-features = false }
vitul-cli = { path = "../../crates/vitul-cli" }
log = "0.4.21"

[build-dependencies]
napi-build = "2.4.1"

[features]
default = ["vitul-desktop-cli/default"]
native-tls = ["vitul-desktop-cli/native-tls"]
native-tls-vendored = ["vitul-desktop-cli/native-tls-vendored"]

[lints]
workspace = true
