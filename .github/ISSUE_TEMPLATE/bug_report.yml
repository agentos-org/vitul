name: 🐞 Bug Report
title: '[bug] '
description: Report a bug
labels: ['type: bug', 'status: needs triage']

body:
  - type: markdown
    attributes:
      value: |
        ## First of all
        1. Please search the [Vitul issue tracker](https://github.com/agentos-org/vitul/issues) first.
        2. Make sure `rustc`, Vitul, and the packages involved are up to date.
        3. Confirm the issue is reproducible with Vitul and include the relevant platform.
        4. Remember to follow our community guidelines and be friendly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is. Include screenshots if applicable.
      placeholder: Bug description
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a reproduction repo or steps to reproduce the behaviour.
      placeholder: |
        Please provide a minimal reproduction or steps to reproduce, see this guide https://stackoverflow.com/help/minimal-reproducible-example
        Why reproduction is required? see this article https://antfu.me/posts/why-reproductions-are-required

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear description of what you expected to happen.

  - type: textarea
    id: info
    attributes:
      label: Full `vitul info` output
      description: 'Output of `pnpm vitul info`, `vitul info`, or `cargo vitul info`'
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Stack trace
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
