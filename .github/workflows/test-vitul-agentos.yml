name: test Vitul AgentOS

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agentos-arm64-smoke:
    name: Vitul AgentOS ARM64 package smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.90

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file jq libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: vitul-agentos-arm64

      - name: Test Vitul CLI
        run: cargo test -p vitul-cli --locked

      - name: Build Vitul CLI and smoke-test a fresh npm project
        run: |
          cargo build -p vitul-cli --locked
          project_parent=$(mktemp -d)
          project_dir="$project_parent/time-memo"
          mkdir -p "$project_dir"
          cd "$project_dir"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          "$GITHUB_WORKSPACE/target/debug/vitul" create . --yes --manager pnpm --template react-ts --identifier com.litevar.agentos.timeMemo --product-name "Time Memo" --window-title "Time Memo"
          test -f vitul.conf.json
          test ! -f src-vitul/vitul.conf.json
          test ! -f src-vitul/tauri.conf.json
          test -f backend/Cargo.toml
          test -f src/opentool.ts
          pnpm remove -D @litevar/vitul-cli
          pnpm pkg set "scripts.vitul=$GITHUB_WORKSPACE/target/debug/vitul"
          pnpm install
          pnpm run build
          pnpm run vitul dev --help
          cargo check --manifest-path src-vitul/Cargo.toml
          test -f src-vitul/vitul.conf.json
          test -f src-vitul/tauri.conf.json
          cargo test --manifest-path backend/Cargo.toml
          pnpm run vitul agentos validate
          echo "VITUL_CI_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Build API and Vitul CLI
        run: |
          pnpm build:api
          pnpm build:cli:debug

      - name: Build the generated npm project as an AgentOS app
        run: |
          cd "$VITUL_CI_PROJECT_DIR"
          pnpm run vitul build --target agentos/arm64

      - name: Validate the generated .agt package
        shell: bash
        run: |
          artifact=$(find "$VITUL_CI_PROJECT_DIR/dist" -maxdepth 1 -type f -name '*-agentos-arm64.agt' -print -quit)
          test -n "$artifact"

          package_dir=$(mktemp -d)
          entries="$package_dir/entries.txt"
          tar -tzf "$artifact" > "$entries"
          grep -Eq '^\./app\.json$' "$entries"
          grep -Eq '^\./web/index\.html$' "$entries"
          grep -Eq '^\./bin/vitul-backend$' "$entries"

          manifest=$(tar -xOzf "$artifact" ./app.json)
          printf '%s' "$manifest" | jq --exit-status '
            .manifestVersion == 1 and
            .architecture == "arm64" and
            .run.type == "process" and
            .run.port == 9627 and
            .run.healthCheck == "/opentool/version" and
            .frontend.entry == "/" and
            .rpc.protocol == "opentool" and
            .rpc.version == 2 and
            .rpc.basePath == "/opentool" and
            (.permissions | index("native.window-control") != null)
          ' >/dev/null

          tar -xzf "$artifact" -C "$package_dir"
          header=$(readelf -h "$package_dir/bin/vitul-backend")
          grep -Eq 'Machine:.*AArch64' <<< "$header"
          echo "Validated $artifact"
