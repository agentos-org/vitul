name: publish Vitul npm commands

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish, or all for a normal release'
        type: choice
        options:
          - all
          - vitul
          - create-vitul-app
        default: all
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  check-cli:
    name: Check native CLI release
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require the native CLI release
        run: npm view @litevar/vitul-cli@3.2.0 version

  publish:
    runs-on: ubuntu-latest
    needs: check-cli
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.package == 'all' && '["vitul","create-vitul-app"]' || inputs.package == 'vitul' && '["vitul"]' || '["create-vitul-app"]') }}
    name: Publish ${{ matrix.package == 'vitul' && '@litevar/vitul' || matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Review package contents
        run: npm pack --dry-run
        working-directory: ${{ matrix.package == 'vitul' && 'packages/vitul' || 'packages/create-vitul-app' }}
      - name: Publish with provenance
        run: npm publish --access public --provenance
        working-directory: ${{ matrix.package == 'vitul' && 'packages/vitul' || 'packages/create-vitul-app' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
