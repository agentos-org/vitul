packages:
  - packages/api
  - packages/api-e2e
  - packages/cli
  - packages/vitul
  - packages/create-vitul-app
  - crates/tauri-schema-worker
  - tests/fixtures/desktop-api
  - examples/starter/vitul-demo
  - examples/agentos/process/frame-video

linkWorkspacePackages: true

allowBuilds:
  # appium's postinstall only auto-installs drivers for global installs; ours
  # are regular devDependencies of packages/api-e2e, which appium picks up on
  # its own, so there is nothing for it to do
  appium: false
  # transitive deps of @wdio/utils; their postinstall downloads browser drivers
  # the Tauri suite never uses (it drives the app via tauri-driver)
  edgedriver: false
  esbuild: true
  geckodriver: false
  sharp: true
  workerd: true

overrides:
  devalue@<5.9.3: ^5.9.3
  undici@>=7.0.0 <7.29.1: ^7.29.1
  ip-address@<10.7.1: ^10.7.1
  brace-expansion@>=1.0.0 <2.0.0: ^1.1.21
  brace-expansion@>=2.0.0 <3.0.0: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  axios@>=1.0.0 <1.20.0: ^1.20.0
  basic-ftp@<6.2.1: ^6.2.1
  source-map-js@<1.2.2: ^1.2.2
  sharp@<0.35.5: ^0.35.5
  shell-quote@<1.11.0: ^1.11.0
  morgan@<1.12.0: ^1.12.0
  serialize-javascript@<7.0.5: ^7.0.5

auditConfig:
  ignoreGhsas:
    # extract-zip symlink path traversal; no patched release exists (latest is
    # still 2.0.1). Reached via @wdio/utils > @puppeteer/browsers, which only
    # unpacks the browser drivers we never download (see allowBuilds above)
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3

minimumReleaseAgeExclude:
  - '@crabnebula/test-runner-backend-darwin-arm64@0.3.0'
  - '@crabnebula/test-runner-backend-darwin-x64@0.3.0'
  - '@crabnebula/test-runner-backend-linux-x64-gnu@0.3.0'
  - '@crabnebula/test-runner-backend-win32-x64-msvc@0.3.0'
  - '@crabnebula/test-runner-backend@0.3.0'
