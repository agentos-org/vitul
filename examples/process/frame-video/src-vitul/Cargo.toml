[package]
name = "frame-video"
version = "0.2.0"
description = "Frame Video"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "frame_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../../../crates/tauri-build", features = [] }

[dependencies]
tauri = { path = "../../../crates/tauri", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
vitul-backend = { package = "frame-video-backend", path = "../backend" }
axum = "0.7"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
tauri = { path = "../../../crates/tauri" }
tauri-plugin = { path = "../../../crates/tauri-plugin" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
