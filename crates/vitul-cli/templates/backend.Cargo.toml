[package]
name = "vitul-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vitul-backend"
path = "src/main.rs"

[lib]
name = "vitul_backend"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
opentool-rust = { git = "https://github.com/opentool-hub/opentool-rust", version = "0.1" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
