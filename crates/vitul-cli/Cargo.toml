[package]
name = "vitul-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "vitul"
path = "src/main.rs"

[[bin]]
name = "cargo-vitul"
path = "src/cargo_vitul_main.rs"

[dependencies]
anyhow = "1"
create-vitul-app = { path = "../../vendor/create-vitul-app" }
serde_json = "1"
tauri-cli = { path = "../tauri-cli" }
tempfile = "3"

[lints]
workspace = true
