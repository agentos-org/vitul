[package]
name = "vitul-cli"
version = "0.1.0"
description = "Vitul's OpenTool-first application CLI, derived from Tauri 2 tooling."
edition = "2024"
publish = false

[[bin]]
name = "vitul"
path = "src/main.rs"

[[bin]]
name = "cargo-vitul"
path = "src/cargo_vitul_main.rs"

[dependencies]
anyhow = "1"
create-vitul-app = { path = "../create-vitul-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vitul-desktop-cli = { path = "../tauri-cli" }
tempfile = "3"
url = "2"

[lints]
workspace = true
