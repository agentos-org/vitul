[package]
name = "create-vitul-app"
description = "Internal Vitul frontend template engine."
authors = ["Tauri Programme within The Commons Conservancy"]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://gitlab.litevar.com:90/litevar/agentos/vitul"
keywords = ["vitul", "opentool"]
categories = ["gui"]
publish = false
rust-version = "1.71"

[workspace]
resolver = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dependencies]
anyhow = "1"
dialoguer = "0.12"
pico-args = "0.5"
ctrlc = "3.3"
rust-embed = { version = "8.3", features = ["interpolate-folder-path"] }
whoami = { version = "1.6.0", default-features = false }
