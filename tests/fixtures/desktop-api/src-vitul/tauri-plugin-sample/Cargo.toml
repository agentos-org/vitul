[package]
name = "tauri-plugin-sample"
version = "0.1.0"
edition = "2024"
links = "tauri-plugin-sample"

[dependencies]
tauri = { path = "../../../../../crates/tauri" }
log = "0.4"
serde = "1"
serde_json = "1"
thiserror = "2"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri = { path = "../../../../../crates/tauri", features = ["wry"] }

[build-dependencies]
tauri-plugin = { path = "../../../../../crates/tauri-plugin", features = ["build"] }
